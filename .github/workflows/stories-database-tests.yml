name: Stories database tests

on:
  pull_request:
    paths:
      - ".github/workflows/stories-database-tests.yml"
      - "database/migrations/20260929120000_stories_foundation.sql"
      - "database/migrations/20261005120000_story_media_storage.sql"
      - "database/schema.sql"
      - "lib/stories/story-media*.ts"
      - "lib/stories/story-admin*.ts"
      - "lib/stories/story-actions*.ts"
      - "lib/admin-session*.ts"
      - "app/admin/historias/**"
      - "app/api/admin/stories/media/**"
      - "app/admin/login/**"
      - "components/admin/stories/**"
      - "components/redesign-v2/stories/**"
      - "lib/supabase.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/prepare-stories-supabase-ci.mjs"
      - "tests/stories/**"
  push:
    branches:
      - codex/historias-a16b1
      - codex/historias-a16c
      - codex/historias-a16b2
    paths:
      - ".github/workflows/stories-database-tests.yml"
      - "database/migrations/20260929120000_stories_foundation.sql"
      - "database/migrations/20261005120000_story_media_storage.sql"
      - "database/schema.sql"
      - "lib/stories/story-media*.ts"
      - "lib/stories/story-admin*.ts"
      - "lib/stories/story-actions*.ts"
      - "lib/admin-session*.ts"
      - "app/admin/historias/**"
      - "app/api/admin/stories/media/**"
      - "app/admin/login/**"
      - "components/admin/stories/**"
      - "components/redesign-v2/stories/**"
      - "lib/supabase.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/prepare-stories-supabase-ci.mjs"
      - "tests/stories/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stories-database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stories-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      STORIES_CI_WORKDIR: .tmp/stories-supabase-ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.101.0

      - name: Verify local tooling
        run: |
          node --version
          test "$(supabase --version)" = "2.101.0"

      - name: Install locked Node.js dependencies
        run: npm ci --no-audit --no-fund

      - name: Run A16B1 unit tests
        run: |
          node --import tsx --test lib/stories/story-media-validation.test.ts
          node --conditions=react-server --import tsx --test lib/stories/story-media.server.test.ts

      - name: Run A16C application tests
        run: |
          node --import tsx --test lib/admin-session.test.ts lib/stories/story-admin.test.ts
          node --conditions=react-server --import tsx --test lib/stories/story-admin.server.test.ts
          node --conditions=react-server --experimental-test-module-mocks --import tsx --test lib/stories/story-actions.server.test.ts
          node --import tsx --test lib/stories/story-validation.test.ts components/redesign-v2/stories/story-renderer.test.tsx

      - name: Run A16B2 protected uploader tests
        run: |
          node --import tsx --test components/admin/stories/story-media-uploader.test.ts
          node --conditions=react-server --import tsx --test lib/stories/story-media-api.server.test.ts

      - name: Prepare isolated Stories workspace
        run: node scripts/prepare-stories-supabase-ci.mjs

      - name: Start ephemeral Supabase and apply Stories migrations
        run: |
          supabase --workdir "$STORIES_CI_WORKDIR" start > /dev/null
          touch "$STORIES_CI_WORKDIR/.stack-started"

      - name: Run Stories pgTAP assertions
        run: supabase --workdir "$STORIES_CI_WORKDIR" test db --local

      - name: Run ephemeral Story media Storage integration
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/stories-supabase.env"
          supabase --workdir "$STORIES_CI_WORKDIR" status -o env > "$env_file"
          set -a
          source "$env_file"
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="${API_URL:-${SUPABASE_URL:-}}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-}"
          export STORIES_STORAGE_INTEGRATION=1
          export STORIES_ADMIN_INTEGRATION=1
          node --conditions=react-server --import tsx --test \
            tests/stories/story-media-storage.integration.test.ts
          node --conditions=react-server --import tsx --test \
            tests/stories/story-admin.integration.test.ts
          rm -f "$env_file"

      - name: Lint isolated Stories schema
        run: >-
          supabase --workdir "$STORIES_CI_WORKDIR" db lint --local
          --schema public --level error --fail-on error

      - name: Stop and destroy ephemeral workspace
        if: always()
        shell: bash
        run: |
          cleanup_status=0
          if [ -f "$STORIES_CI_WORKDIR/.stack-started" ]; then
            supabase --workdir "$STORIES_CI_WORKDIR" stop --no-backup || cleanup_status=$?
          else
            supabase --workdir "$STORIES_CI_WORKDIR" stop --no-backup || true
          fi
          node scripts/prepare-stories-supabase-ci.mjs --clean || cleanup_status=$?
          exit "$cleanup_status"
