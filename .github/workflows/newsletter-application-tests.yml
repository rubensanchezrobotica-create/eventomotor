name: Newsletter application tests

on:
  push:
    branches:
      - "feature/newsletter-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: newsletter-application-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEWSLETTER_MODE: "off"
  NEWSLETTER_MAIL_TRANSPORT: "disabled"

jobs:
  newsletter-application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: R4A tests
        run: npm run test:newsletter-r4a

      - name: R4B tests
        run: npm run test:newsletter-r4b

      - name: R5A tests
        run: npm run test:newsletter-r5a

      - name: R5A.1 tests
        run: npm run test:newsletter-r5a1

      - name: R5A.2 tests
        run: npm run test:newsletter-r5a2

      - name: R5A.3 tests
        run: npm run test:newsletter-r5a3

      - name: R5B tests
        run: npm run test:newsletter-r5b

      - name: Manual campaign tests
        run: npm run test:newsletter-campaign

      - name: Edition 02 tests
        run: npm run test:newsletter-edition02

      - name: Standard application tests
        shell: bash
        run: |
          mapfile -t standard_tests < <(
            git ls-files -- '*.test.ts' '*.test.tsx' |
              grep -Ev '^(lib/newsletter/newsletter-(core|migration)\.test\.ts|tests/newsletter/newsletter-(r3a|r3b1|r3b3|r3b4|r4a|r4b|r5a|r5a1|r5a2|r5a3|r5b|manual-campaign|edition-02)\.test\.ts|lib/commercial/commercial\.test\.ts|lib/(opportunity-pages-freshness|public-events-pagination)\.test\.ts|lib/stories/.*\.server\.test\.ts|lib/stories/story-responsive-images\.test\.ts|tests/stories/.*\.integration\.test\.ts|tests/stories/story-(home-section|public-routes)\.test\.tsx|tests/stories/story-publication-actions\.test\.ts)$'
          )
          test "${#standard_tests[@]}" -gt 0
          node --import tsx --test "${standard_tests[@]}"

      # These suites import server-only modules and cannot run under the default
      # client resolution mode. Keep their actual assertions in CI.
      # Stories DB integration is executed separately by stories-database-tests.yml
      # with a disposable Supabase instance, not by this no-DB job.
      - name: Server-context application and Stories unit tests
        run: >-
          node --conditions=react-server --experimental-test-module-mocks --import tsx --test
          lib/commercial/commercial.test.ts
          lib/opportunity-pages-freshness.test.ts
          lib/public-events-pagination.test.ts
          lib/stories/story-actions.server.test.ts
          lib/stories/story-admin-read.server.test.ts
          lib/stories/story-admin.server.test.ts
          lib/stories/story-commercial.server.test.ts
          lib/stories/story-editorial-gate.server.test.ts
          lib/stories/story-home.server.test.ts
          lib/stories/story-launch.server.test.ts
          lib/stories/story-media-api.server.test.ts
          lib/stories/story-media.server.test.ts
          lib/stories/story-public.server.test.ts
          lib/stories/story-publication.server.test.ts
          lib/stories/story-responsive-images.test.ts
          tests/stories/story-home-section.test.tsx
          tests/stories/story-public-routes.test.tsx
          tests/stories/story-publication-actions.test.ts

      - name: React-server tests
        run: >-
          node --conditions=react-server --import tsx --test
          lib/newsletter/newsletter-core.test.ts
          lib/newsletter/newsletter-migration.test.ts
          tests/newsletter/newsletter-r3a.test.ts
          tests/newsletter/newsletter-r3b1.test.ts
          tests/newsletter/newsletter-r3b3.test.ts
          tests/newsletter/newsletter-r3b4.test.ts
          tests/newsletter/newsletter-r4a.test.ts
          tests/newsletter/newsletter-r4b.test.ts
          tests/newsletter/newsletter-r5a.test.ts
          tests/newsletter/newsletter-r5a1.test.ts
          tests/newsletter/newsletter-r5a2.test.ts
          tests/newsletter/newsletter-r5a3.test.ts
          tests/newsletter/newsletter-r5b.test.ts
          tests/newsletter/newsletter-manual-campaign.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
